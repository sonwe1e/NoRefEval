name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # USERPLAN §11: nightly full metamorphic run at 02:00 UTC.
    - cron: "0 2 * * *"

# USERPLAN §11: session-level inspection cache keyed on
# (case_id, role, mode, clips) so localization/score/metric-direction
# share no-clips results.  The cache lives in pytest's tmp_path_factory
# (session-scoped) — no cross-run persistence needed for CI.
env:
  RR_VFIQA_TEST_FLOW: farneback

jobs:
  # -----------------------------------------------------------------------
  # unit: pure-function / schema / map / artifact tests — fast, no video eval
  # -----------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev)
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import rr_vfiqa; print('import OK', rr_vfiqa.__version__)"

      - name: Unit tests (pure functions, schemas, maps, artifacts)
        run: >-
          python -m pytest -v
          tests/test_artifact_pipeline.py
          tests/test_artifact_status_edge.py
          tests/test_error_map_contract.py
          tests/test_diagnosis_map_selection.py
          tests/test_package_contract.py
          tests/test_nr_error_maps.py
          tests/test_spatial_normalization.py
          tests/test_mode_validation.py
          tests/test_p0_contracts.py

  # -----------------------------------------------------------------------
  # full-cpu: all non-corpus tests — runs on every PR
  # -----------------------------------------------------------------------
  full-cpu:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev + fusion)
        run: pip install -e ".[dev,fusion]"

      - name: Full CPU suite excluding real corpus
        env:
          RR_VFIQA_TEST_FLOW: farneback
        run: >-
          python -m pytest tests/ -v
          --ignore=tests/real_corpus

  # -----------------------------------------------------------------------
  # smoke-e2E: one strong defect per mode + multi-issue — runs on every PR
  # -----------------------------------------------------------------------
  smoke-e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev + fusion)
        run: pip install -e ".[dev,fusion]"

      - name: Smoke E2E (one strong defect per mode, WITH clips)
        env:
          RR_VFIQA_TEST_FLOW: farneback
        run: >-
          python -m pytest -v
          tests/real_corpus/test_metamorphic_regression.py::TestMediaE2E::test_default_inspect_with_clips
          tests/real_corpus/test_metamorphic_regression.py::TestMediaE2E::test_multi_issue_files_are_distinct
          tests/test_inspect.py::test_inspect_nr_end_to_end
          tests/test_multimode.py::test_no_reference_60_and_120_are_time_normalized
          tests/test_multimode.py::test_full_reference_is_separate_and_detects_same_rate_error

  # -----------------------------------------------------------------------
  # metamorphic: all 15 RPG cases — nightly / main merge / manual
  # -----------------------------------------------------------------------
  metamorphic:
    runs-on: ubuntu-latest
    needs: unit
    # Only run on main branch pushes, schedule, or workflow_dispatch.
    # PRs run smoke-e2e + full-cpu instead (faster feedback).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev + fusion)
        run: pip install -e ".[dev,fusion]"

      - name: Metamorphic regression (all 15 RPG cases)
        env:
          RR_VFIQA_TEST_FLOW: farneback
        run: >-
          python -m pytest -v
          tests/real_corpus/test_metamorphic_regression.py
          tests/test_pipeline.py
          tests/test_multimode.py

  # -----------------------------------------------------------------------
  # gpu: RAFT path — opt-in via self-hosted GPU runner
  # -----------------------------------------------------------------------
  gpu:
    # Opt-in GPU job: set repository variable RUN_GPU_CI=true and provide a
    # self-hosted CUDA runner label via GPU_RUNNER_LABEL.
    if: vars.RUN_GPU_CI == 'true'
    runs-on: ${{ vars.GPU_RUNNER_LABEL || 'self-hosted' }}
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + torch + dev + fusion)
        run: pip install -e ".[dev,fusion,torch]"

      - name: GPU test suite (RAFT path)
        env:
          RR_VFIQA_TEST_FLOW: raft
        run: python -m pytest tests/ -v

      - name: Three-mode directional contracts (GPU)
        env:
          RR_VFIQA_TEST_FLOW: raft
        run: >-
          python -m pytest -v
          tests/test_pipeline.py::test_bad_scores_below_good
          tests/test_multimode.py::test_no_reference_60_freeze_lowers_common_time_score
          tests/test_multimode.py::test_full_reference_is_separate_and_detects_same_rate_error
