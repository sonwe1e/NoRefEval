name: docs

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "rr_vfiqa/cli.py"
      - "rr_vfiqa/fusion/**"
      - "rr_vfiqa/_version.py"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "rr_vfiqa/cli.py"
      - "rr_vfiqa/fusion/**"
      - "rr_vfiqa/_version.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (core + dev)
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import rr_vfiqa; print('import OK', rr_vfiqa.__version__)"

      - name: Docs contract tests
        env:
          RR_VFIQA_TEST_FLOW: farneback
        run: >-
          python -m pytest -v
          tests/test_docs_contract.py
