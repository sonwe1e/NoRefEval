[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rr-vfiqa"
version = "0.3.0"
description = "Mode-aware no-reference, endpoint-reference, and full-reference VFI quality assessment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "av>=11.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
fusion = ["lightgbm>=4.0"]
viz = ["matplotlib>=3.7"]
audit = ["cotracker>=0.3"]     # audit-tier point tracker (USERPLAN §8.5)
vqa = ["torch>=2.1", "pyiqa>=0.1.13"]
dev = ["pytest>=7.0"]

[project.scripts]
rr-vfiqa = "rr_vfiqa.cli:main"

[tool.setuptools.packages.find]
include = ["rr_vfiqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
